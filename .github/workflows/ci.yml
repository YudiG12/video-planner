name: CI
on: [pull_request]
permissions: { contents: write, pull-requests: write }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - run: sudo apt-get install -y ffmpeg >/dev/null && npx playwright install --with-deps chromium
      - id: verify
        run: npm run verify
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: verify-out, path: verify-out }
      # Proof comment: images go to the verify-assets branch, comment is updated in place
      - name: Publish proof on the PR
        if: always() && hashFiles('verify-out/report.json') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          dir=pr-$PR/$SHA
          url="https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY"
          git clone -q --depth 1 --branch verify-assets "$url" /tmp/assets 2>/dev/null || { git init -q -b verify-assets /tmp/assets && git -C /tmp/assets remote add origin "$url"; }
          mkdir -p /tmp/assets/$dir && cp verify-out/*.png verify-out/*.gif /tmp/assets/$dir/ 2>/dev/null || true
          cd /tmp/assets && git config user.name github-actions && git config user.email github-actions@users.noreply.github.com
          git add -A && git commit -qm "proof $dir" && git push -q origin verify-assets && cd "$GITHUB_WORKSPACE"
          node scripts/pr-proof.mjs "$GITHUB_REPOSITORY" "$PR" "$SHA" > proof.md
          id=$(gh api repos/$GITHUB_REPOSITORY/issues/$PR/comments -q '.[] | select(.body | startswith("<!-- pr-proof -->")) | .id' | head -1)
          if [ -n "$id" ]; then gh api -X PATCH repos/$GITHUB_REPOSITORY/issues/comments/$id -F body=@proof.md >/dev/null; else gh pr comment $PR --body-file proof.md; fi
      - if: steps.verify.outcome == 'failure'
        run: exit 1
